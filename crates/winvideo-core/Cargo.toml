[package]
name = "winvideo-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Modern hardware-accelerated Windows screen and window video capture core engine by SINARY™"
keywords = ["windows", "video", "screen-capture", "wgc", "directx"]
categories = ["multimedia::video", "os::windows-apis"]

[dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
