[package]
name = "winvideo-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool for Windows screen and window video capture by SINARY™"
keywords = ["windows", "video", "screen-capture", "wgc", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "winvideo"
path = "src/main.rs"

[dependencies]
winvideo-core = { path = "../winvideo-core", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
ctrlc = "3.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
